name: Technocore safe contributor

on:
  workflow_dispatch:
    inputs:
      live_post:
        description: "Post the signed snapshot (false runs a read-only probe)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: technocore-safe-contributor
  cancel-in-progress: false

jobs:
  contribute:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pinned repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify safety gates
        run: node --test technocore_guard/agent.test.mjs

      - name: Run read-only representative probe
        if: github.event_name == 'workflow_dispatch' && inputs.live_post != true
        run: node technocore_guard/agent.mjs probe

      - name: Preflight the live activity endpoints
        if: github.event_name == 'schedule' || inputs.live_post == true
        run: node technocore_guard/agent.mjs probe

      - name: Resolve the JST activity day
        id: activity_day
        if: github.event_name == 'schedule' || inputs.live_post == true
        run: echo "day=$(date -u -d '+9 hours' +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the daily activity claim
        id: daily_claim
        if: github.event_name == 'schedule' || inputs.live_post == true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .technocore-state/${{ steps.activity_day.outputs.day }}
          key: technocore-daily-v1-${{ steps.activity_day.outputs.day }}

      - name: Prepare the daily activity claim
        if: >-
          (github.event_name == 'schedule' || inputs.live_post == true) &&
          steps.daily_claim.outputs.cache-hit != 'true'
        run: |
          mkdir -p ".technocore-state/${{ steps.activity_day.outputs.day }}"
          printf 'claimed-before-post\n' > ".technocore-state/${{ steps.activity_day.outputs.day }}/claim"

      - name: Save the daily activity claim before posting
        if: >-
          (github.event_name == 'schedule' || inputs.live_post == true) &&
          steps.daily_claim.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .technocore-state/${{ steps.activity_day.outputs.day }}
          key: technocore-daily-v1-${{ steps.activity_day.outputs.day }}

      - name: Report an already-claimed day
        if: >-
          (github.event_name == 'schedule' || inputs.live_post == true) &&
          steps.daily_claim.outputs.cache-hit == 'true'
        run: echo "The JST activity day was already claimed; no post was attempted."

      - name: Publish one signed conformance snapshot
        if: >-
          (github.event_name == 'schedule' || inputs.live_post == true) &&
          steps.daily_claim.outputs.cache-hit != 'true'
        env:
          TECHNOCORE_ENABLED: ${{ vars.TECHNOCORE_ENABLED }}
          TECHNOCORE_SIGN_SEED: ${{ secrets.TECHNOCORE_SIGN_SEED }}
        run: |
          if [ "$TECHNOCORE_ENABLED" != "true" ]; then
            echo "Kill switch is off; no post was made."
            exit 0
          fi
          if ! printf '%s' "$TECHNOCORE_SIGN_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "TECHNOCORE_SIGN_SEED is missing or invalid; no post was made."
            exit 1
          fi
          echo "::add-mask::$TECHNOCORE_SIGN_SEED"
          node technocore_guard/agent.mjs contribute-daily
